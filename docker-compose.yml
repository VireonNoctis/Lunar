version: "3.9"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lunar
      POSTGRES_USER: lunar
      POSTGRES_PASSWORD: lunar
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lunar -d lunar"]
      interval: 10s
      timeout: 5s
      retries: 3

  dashboard-backend:
    build:
      context: .
      dockerfile: dashboard/backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://lunar:lunar@postgres:5432/lunar
      - REDIS_URL=redis://redis:6379/0
      - OAUTH_CLIENT_ID=${OAUTH_CLIENT_ID:-}
      - OAUTH_CLIENT_SECRET=${OAUTH_CLIENT_SECRET:-}
      - OAUTH_CALLBACK_URL=${OAUTH_CALLBACK_URL:-http://localhost:8000/auth/discord/callback}
      - DASHBOARD_SECRET=${DASHBOARD_SECRET:-dev-secret-change-in-production}
      - TOKEN=${TOKEN:-}
      - DASHBOARD_PORT=8000
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./dashboard:/app/dashboard
      - ./feature_mapping.json:/app/feature_mapping.json:ro

  dashboard-frontend:
    build:
      context: ./dashboard/frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - dashboard-backend

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    environment:
      - TOKEN=${TOKEN:-}
      - DATABASE_URL=${DATABASE_URL:-}
      - REDIS_URL=redis://redis:6379/0
      - DASHBOARD_API=http://dashboard-backend:8000
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./bot.py:/app/bot.py:ro
      - ./cogs:/app/cogs:ro
      - ./feature_mapping.json:/app/feature_mapping.json:ro
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@lunar.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      - postgres
    profiles:
      - debug

volumes:
  redis_data:
  pg_data:
